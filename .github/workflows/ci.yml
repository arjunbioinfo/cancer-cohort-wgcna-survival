name: CI — Cancer Cohort WGCNA, GSEA & Survival (R / Bioconductor)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R 4.4
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          use-public-rspm: true

      - name: Install R & Bioconductor dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - name: Run offline testthat unit tests
        run: Rscript -e "testthat::test_dir('tests/testthat', stop_on_failure = TRUE)"

      - name: Run full pipeline on real TCGA-CESC cohort (UCSC Xena)
        run: Rscript run_pipeline.R --config config/ci.yaml

      - name: Verify expected outputs
        run: |
          test -s results/limma_de_results.tsv
          test -s results/fgsea_pathways.tsv
          test -s results/wgcna_module_membership.tsv
          test -s results/wgcna_module_traits.tsv
          test -s results/survival_module_cox.tsv
          test -s results/survival_hub_genes.tsv
          test -s figures/limma_volcano_gsea.png
          test -s figures/wgcna_module_trait_heatmap.png
          test -s figures/survival_forest_km.png
          test -s figures/hub_genes_summary.png

      - name: Upload CI figures and summary tables
        uses: actions/upload-artifact@v4
        with:
          name: ci-tcga-cesc-outputs
          path: |
            results/fgsea_pathways.tsv
            results/wgcna_module_traits.tsv
            results/survival_module_cox.tsv
            results/survival_hub_genes.tsv
            figures/*.png
