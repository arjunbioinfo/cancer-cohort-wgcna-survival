# Full TCGA-CESC (Cervical Squamous Cell Carcinoma) configuration via UCSC Xena

cohort:
  name: "TCGA-CESC"
  expr_url: "https://tcga.xenahubs.net/download/TCGA.CESC.sampleMap/HiSeqV2.gz"
  survival_url: "https://tcga.xenahubs.net/download/survival/CESC_survival.txt"
  clinical_url: "https://tcga.xenahubs.net/download/TCGA.CESC.sampleMap/CESC_clinicalMatrix"

de:
  min_mean_expr: 1.0
  padj_threshold: 0.05
  lfc_threshold: 0.5

wgcna:
  top_mad_genes: 3000
  min_module_size: 30
  merge_cut_height: 0.25
  r2_target: 0.80
  fallback_power: 6

survival:
  min_os_days: 30
  top_hub_genes_per_module: 15

plotting:
  highlight_genes:
    - "MCM5"
    - "FN1"
    - "KIF11"
    - "CDC45"
    - "CDH2"
    - "MYC"

random_seed: 42

output_dirs:
  data: "data/raw"
  results: "results"
  figures: "figures"
